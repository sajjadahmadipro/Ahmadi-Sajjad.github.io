<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmadi Dashboard</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Montserrat', sans-serif; opacity: 0; animation: fadeIn 0.5s ease-out forwards; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .layout-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* Sidebar Collapsed Styles */
        .sidebar-collapsed .nav-text { display: none; }
        .sidebar-collapsed .profile-section { padding: 10px; }
        .sidebar-collapsed .profile-img-container { width: 40px; height: 40px; margin-bottom: 0; }
        .sidebar-collapsed .profile-info { display: none; }
        .sidebar-collapsed .section-header { display: none; }
        .sidebar-collapsed .nav-item { justify-content: center; padding-left: 0; padding-right: 0; }
        .sidebar-collapsed .nav-icon { margin-right: 0; }
        
        /* Disable transition momentarily to prevent load flicker */
        .no-transition { transition: none !important; }
    </style>
</head>
<body class="text-white min-h-screen bg-black selection:bg-white selection:text-black">

    <div class="fixed top-0 left-0 w-full h-full -z-10">
        <video autoplay muted loop playsinline poster="Resources/video-poster.jpg" id="bg-video" class="w-full h-full object-cover opacity-50 blur-sm">
            <source src="Resources/DarkMode.mp4" type="video/mp4">
        </video>
        <div class="absolute inset-0 bg-black/60"></div>
    </div>

    <button id="sidebar-toggle" class="fixed top-4 left-4 z-60 w-10 h-10 flex items-center justify-center bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/20 rounded-lg text-white transition-all duration-300 shadow-lg group">
        <i class="fas fa-bars text-lg group-hover:scale-110 transition-transform"></i>
    </button>

    <aside id="sidebar" class="fixed top-0 left-0 h-full bg-black/80 backdrop-blur-xl border-r border-white/10 z-50 layout-transition -translate-x-full lg:translate-x-0 w-20 sidebar-collapsed overflow-hidden flex flex-col">
        
        <div class="profile-section mt-16 mb-4 px-4 flex flex-col items-center justify-center transition-all duration-300">
            <div class="profile-img-container w-12 h-12 rounded-full border border-white/30 p-0.5 mb-3 shadow-[0_0_15px_rgba(255,255,255,0.1)] shrink-0 transition-all">
                <img src="Resources/Profile pic.jpg" class="w-full h-full rounded-full object-cover" alt="Profile">
            </div>
            <div class="profile-info text-center whitespace-nowrap overflow-hidden">
                <h2 class="font-bold text-lg tracking-wide">Ahmadi</h2>
                <p class="text-[10px] text-gray-400 uppercase tracking-widest">Developer</p>
            </div>
        </div>

        <nav class="flex-1 overflow-y-auto px-3 space-y-6">
            <div>
                <h3 class="section-header text-[10px] font-bold text-gray-500 uppercase tracking-widest px-3 mb-2">Projects</h3>
                <ul class="space-y-1">
                    <li>
                        <a href="lms.html" class="nav-item flex items-center py-3 px-3 rounded-xl hover:bg-white/10 transition-colors group border border-transparent hover:border-white/5">
                            <i class="fas fa-book w-6 text-center text-gray-400 group-hover:text-white nav-icon transition-colors"></i>
                            <span class="nav-text text-sm font-medium ml-3 whitespace-nowrap">L.M.S</span>
                        </a>
                    </li>
                    <li>
                        <a href="ode.html" class="nav-item flex items-center py-3 px-3 rounded-xl hover:bg-white/10 transition-colors group border border-transparent hover:border-white/5">
                            <i class="fas fa-calculator w-6 text-center text-gray-400 group-hover:text-white nav-icon transition-colors"></i>
                            <span class="nav-text text-sm font-medium ml-3 whitespace-nowrap">O.D.E Solver</span>
                        </a>
                    </li>
                    <li>
                        <a href="fms.html" class="nav-item flex items-center py-3 px-3 rounded-xl hover:bg-white/10 transition-colors group border border-transparent hover:border-white/5">
                            <i class="fas fa-plane w-6 text-center text-gray-400 group-hover:text-white nav-icon transition-colors"></i>
                            <span class="nav-text text-sm font-medium ml-3 whitespace-nowrap">F.M.S</span>
                        </a>
                    </li>
                </ul>
            </div>

            <div>
                <h3 class="section-header text-[10px] font-bold text-gray-500 uppercase tracking-widest px-3 mb-2">System</h3>
                <ul class="space-y-1">
                    <li>
                        <a href="index.html" class="nav-item flex items-center py-3 px-3 rounded-xl hover:bg-red-500/10 hover:text-red-400 transition-colors group border border-transparent hover:border-red-500/20">
                            <i class="fas fa-power-off w-6 text-center nav-icon"></i>
                            <span class="nav-text text-sm font-medium ml-3 whitespace-nowrap">Exit</span>
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <div class="p-4 border-t border-white/5 text-center">
            <p class="section-header text-[10px] text-gray-600">&copy; 2026 Ahmadi</p>
        </div>
    </aside>

    <div id="mobile-overlay" class="fixed inset-0 bg-black/80 z-40 hidden lg:hidden opacity-0 transition-opacity duration-300"></div>

    <main id="main-content" class="min-h-screen pt-20 px-4 pb-8 lg:pt-8 lg:pr-8 lg:ml-20 layout-transition w-full flex flex-col">
        
        <div class="bg-white/5 backdrop-blur-md border border-white/10 rounded-3xl overflow-hidden shadow-2xl flex flex-col relative w-full h-auto">
            
            <div id="dynamic-content-area">
                </div>

            </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById("sidebar-toggle");
            const sidebar = document.getElementById("sidebar");
            const mainContent = document.getElementById("main-content");
            const overlay = document.getElementById("mobile-overlay");
            const toggleIcon = toggleBtn.querySelector("i");
            const navLinks = document.querySelectorAll('.nav-item');

            // 1. Highlight Active Link
            const currentPath = window.location.pathname.split("/").pop();
            navLinks.forEach(link => {
                const href = link.getAttribute('href');
                if(href === currentPath) {
                    link.classList.add("bg-white/15", "border-white/20");
                    link.classList.remove("border-transparent");
                    link.querySelector("i").classList.add("text-white");
                    link.querySelector("i").classList.remove("text-gray-400");
                }
            });

            // 2. Sidebar Logic (Defaults to CLOSED/Collapsed)
            let isDesktop = window.innerWidth >= 1024;
            
            // Default to false (collapsed)
            let desktopExpanded = false; 
            let mobileOpen = false;

            // Optional: You can uncomment this if you want it to remember the user's choice
            // const savedState = localStorage.getItem('sidebarState');
            // if(savedState === 'expanded') desktopExpanded = true;

            // Apply initial state logic if we ever change defaults
            if(isDesktop && desktopExpanded) {
                // If we wanted it open, we'd need to add these classes, 
                // but since HTML defaults to closed, we only act if expanded is true
                applyDesktopState();
            }

            function applyDesktopState() {
                if (desktopExpanded) {
                    sidebar.classList.remove("w-20", "sidebar-collapsed");
                    sidebar.classList.add("w-64");
                    mainContent.classList.remove("lg:ml-20");
                    mainContent.classList.add("lg:ml-64");
                } else {
                    sidebar.classList.remove("w-64");
                    sidebar.classList.add("w-20", "sidebar-collapsed");
                    mainContent.classList.remove("lg:ml-64");
                    mainContent.classList.add("lg:ml-20");
                }
            }

            function handleToggle() {
                isDesktop = window.innerWidth >= 1024;
                if (isDesktop) {
                    desktopExpanded = !desktopExpanded;
                    // localStorage.setItem('sidebarState', desktopExpanded ? 'expanded' : 'collapsed');
                    applyDesktopState();
                } else {
                    mobileOpen = !mobileOpen;
                    if (mobileOpen) {
                        sidebar.classList.remove("-translate-x-full");
                        overlay.classList.remove("hidden");
                        setTimeout(() => overlay.classList.remove("opacity-0"), 10);
                        toggleIcon.classList.remove("fa-bars");
                        toggleIcon.classList.add("fa-arrow-left");
                    } else {
                        sidebar.classList.add("-translate-x-full");
                        overlay.classList.add("opacity-0");
                        setTimeout(() => overlay.classList.add("hidden"), 300);
                        toggleIcon.classList.remove("fa-arrow-left");
                        toggleIcon.classList.add("fa-bars");
                    }
                }
            }

            toggleBtn.addEventListener("click", handleToggle);
            overlay.addEventListener("click", handleToggle);

            window.addEventListener('resize', () => {
                const newIsDesktop = window.innerWidth >= 1024;
                if (newIsDesktop && !isDesktop) {
                    mobileOpen = false;
                    sidebar.classList.add("-translate-x-full");
                    overlay.classList.add("hidden", "opacity-0");
                    // Ensure desktop state is respected on resize
                    applyDesktopState();
                }
                isDesktop = newIsDesktop;
            });
        });
    </script>
</body>
</html>
